name: Build and publish witwin-channel

# The wheel matrix (Python minors, PyTorch releases, platforms, CUDA targets, size limit) lives in
# ci/support-matrix.toml; ci/wheel_matrix.py turns it into the job matrices and checks below.
# PyPI receives the wheels for the "pypi" PyTorch release. Wheels for "release-asset" PyTorch
# releases carry a local version (0.6.0+torch211) and are attached to the GitHub release.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: windows-smoke
        type: choice
        options:
          - windows-smoke
          - full

concurrency:
  group: channel-distributions-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  actions: read
  contents: read

env:
  CORE_COMMIT: 46c826d969654912461d2e18b6cb87df9cc3df8f
  RAYD_COMMIT: 763f1b91d90897dc301361528f7fb4af1cb787aa
  RAYD_REPOSITORY_URL: https://github.com/Asixa/RayD

jobs:
  metadata:
    name: Validate release metadata and derive the wheel matrix
    runs-on: ubuntu-22.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      cuda_architectures: ${{ steps.matrix.outputs.cuda_architectures }}
      gencode: ${{ steps.matrix.outputs.gencode }}
      expected_sass: ${{ steps.matrix.outputs.expected_sass }}
      expected_ptx: ${{ steps.matrix.outputs.expected_ptx }}
      max_wheel_mib: ${{ steps.matrix.outputs.max_wheel_mib }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate package, lock, and workflow policy
        working-directory: channel
        shell: bash
        run: |
          python -m pip install "pytest==8.4.2"
          python -m pytest -q --confcutdir=tests \
            tests/test_supported_runtime_matrix.py \
            tests/test_ci_tiers.py \
            tests/kernels/test_rayd_lock_cmake.py::test_rayd_lock_is_machine_readable_and_complete

      - name: Derive the wheel matrix
        id: matrix
        working-directory: channel
        shell: bash
        env:
          SMOKE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-smoke' && '--smoke' || '' }}
        run: python ci/wheel_matrix.py github-outputs $SMOKE | tee -a "$GITHUB_OUTPUT"

      - name: Read the project version
        id: version
        working-directory: channel
        shell: bash
        run: |
          python - <<'PY' | tee -a "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          print(f"version={project['version']}")
          PY

      - name: Validate release tag and version
        if: github.event_name == 'release'
        working-directory: channel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$RELEASE_TAG" != "witwin-channel-v$VERSION" ]]; then
            echo "release tag $RELEASE_TAG must be witwin-channel-v$VERSION" >&2
            exit 1
          fi

  build-windows:
    name: Wheel / Windows / Python ${{ matrix.python }} / Torch ${{ matrix.torch }}
    needs: metadata
    runs-on: windows-2022
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.build) }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "3"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ""
      CMAKE_GENERATOR: Ninja
      SCCACHE_DIR: ${{ github.workspace }}\.cache\channel-sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
      CHANNEL_CUDA_GENCODE_FLAGS: ${{ needs.metadata.outputs.gencode }}
      RAYD_TORCH_CUDA_GENCODE_FLAGS: ${{ needs.metadata.outputs.gencode }}
      EXPECTED_SASS: ${{ needs.metadata.outputs.expected_sass }}
      EXPECTED_PTX: ${{ needs.metadata.outputs.expected_ptx }}
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel
          fetch-depth: 0

      - name: Check out locked Stage-I Core
        uses: actions/checkout@v5
        with:
          repository: witwin-ai/witwin-core
          ref: ${{ env.CORE_COMMIT }}
          path: core
          persist-credentials: false

      - name: Check out locked RayD 0.8.0 source
        uses: actions/checkout@v5
        with:
          repository: Asixa/RayD
          ref: ${{ env.RAYD_COMMIT }}
          path: rayd
          persist-credentials: false

      - name: Check out OptiX 8.1 headers
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: optix
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: channel/constraints/ci-py311-cu128.txt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.cache\channel-sccache
          key: channel-sccache-v2-windows-${{ matrix.python_tag }}-torch${{ matrix.torch }}-${{ inputs.scope || 'release' }}-${{ github.sha }}
          restore-keys: |
            channel-sccache-v2-windows-${{ matrix.python_tag }}-torch${{ matrix.torch }}-${{ inputs.scope || 'release' }}-
            channel-sccache-v2-windows-${{ matrix.python_tag }}-torch${{ matrix.torch }}-

      - name: Install minimal CUDA 12.8 toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev"]'
          log-file-suffix: "channel-windows-${{ matrix.python_tag }}-torch${{ matrix.torch }}"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify locked clean RayD source
        shell: pwsh
        run: |
          git -C rayd remote set-url origin $env:RAYD_REPOSITORY_URL
          $lock = Get-Content -LiteralPath channel/dependencies/rayd.lock.json -Raw | ConvertFrom-Json
          $actualCommit = (git -C rayd rev-parse HEAD).Trim()
          $actualRemote = (git -C rayd remote get-url origin).Trim()
          $dirty = git -C rayd status --porcelain --untracked-files=normal
          if ($lock.commit -cne $env:RAYD_COMMIT) { throw "Channel lock commit mismatch: $($lock.commit)" }
          if ($actualCommit -cne $env:RAYD_COMMIT) { throw "RayD checkout commit mismatch: $actualCommit" }
          if ($lock.repository_url -cne $env:RAYD_REPOSITORY_URL) { throw "Channel lock repository mismatch: $($lock.repository_url)" }
          if ($actualRemote -cne $env:RAYD_REPOSITORY_URL) { throw "RayD checkout repository mismatch: $actualRemote" }
          if ($dirty) { throw "RayD checkout is dirty: $dirty" }
          if (-not (Test-Path -LiteralPath rayd/drjit/scripts/verify_cuda_binary_arches.py -PathType Leaf)) { throw "RayD CUDA architecture verifier is missing" }

      - name: Select the PyTorch release
        if: matrix.channel != 'pypi'
        shell: pwsh
        run: python channel/ci/wheel_matrix.py select-torch --pyproject channel/pyproject.toml --torch ${{ matrix.torch }} --local "${{ matrix.local }}"

      - name: Configure CUDA build profile
        shell: pwsh
        run: |
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) {
            $nvcc = (Get-Command nvcc -ErrorAction Stop).Source
            $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          }
          "CUDA_HOME=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          $rayd = (Resolve-Path -LiteralPath rayd).Path.Replace('\', '/')
          $optix = (Resolve-Path -LiteralPath optix/include).Path.Replace('\', '/')
          "CMAKE_ARGS=-DRAYD_SOURCE_DIR=$rayd -DOPTIX_INCLUDE_DIR=$optix -DCMAKE_CUDA_ARCHITECTURES=${{ needs.metadata.outputs.cuda_architectures }} -DCHANNEL_RELEASE_BUILD=ON" >> $env:GITHUB_ENV

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install `
            "cmake>=4.3,<4.4" `
            "ninja>=1.13,<1.14" `
            "scikit-build-core>=0.12,<0.13"
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cu128
          python -m pip install --no-deps ./core

      - name: Build Windows wheel
        shell: pwsh
        run: |
          python -m build core --wheel --outdir core/dist
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $startedAt = Get-Date
          python -m build channel --wheel --no-isolation --outdir channel/dist `
            -Cbuild-dir="$env:RUNNER_TEMP/channel-skbuild"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsedMinutes = ((Get-Date) - $startedAt).TotalMinutes
          "Windows Channel wheel build: {0:N2} minutes" -f $elapsedMinutes

      - name: Verify Windows wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem channel/dist/*.whl -File -ErrorAction Stop).FullName
          python channel/ci/wheel_matrix.py check-size $wheel --max-mib ${{ needs.metadata.outputs.max_wheel_mib }}
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python rayd/drjit/scripts/verify_cuda_binary_arches.py `
            --stem _channel `
            --expected-sass $env:EXPECTED_SASS `
            --expected-ptx $env:EXPECTED_PTX `
            $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m twine check $wheel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $coreWheel = (Get-ChildItem core/dist/*.whl -File -ErrorAction Stop).FullName
          python channel/ci/wheel_smoke.py $wheel `
            --core-wheel $coreWheel `
            --output channel/dist/windows-wheel-smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          sccache --show-stats

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: channel-wheel-${{ matrix.channel }}-windows-${{ matrix.python_tag }}-torch${{ matrix.torch }}
          path: channel/dist/*.whl
          if-no-files-found: error

  build-linux:
    name: Wheel / manylinux_2_28 / Python ${{ matrix.python }} / Torch ${{ matrix.torch }}
    if: github.event_name == 'release' || inputs.scope == 'full'
    needs: metadata
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.metadata.outputs.build) }}
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/channel-sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel
          fetch-depth: 0

      - name: Check out locked Stage-I Core
        uses: actions/checkout@v5
        with:
          repository: witwin-ai/witwin-core
          ref: ${{ env.CORE_COMMIT }}
          path: core
          persist-credentials: false

      - name: Check out locked RayD 0.8.0 source
        uses: actions/checkout@v5
        with:
          repository: Asixa/RayD
          ref: ${{ env.RAYD_COMMIT }}
          path: rayd
          persist-credentials: false

      - name: Check out OptiX 8.1 headers
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: optix
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: channel/constraints/ci-py311-cu128.txt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"

      - name: Restore compiler and cibuildwheel caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/channel-sccache
            ${{ github.workspace }}/.cache/cibuildwheel
          key: channel-sccache-v2-linux-${{ matrix.python_tag }}-torch${{ matrix.torch }}-${{ github.sha }}
          restore-keys: |
            channel-sccache-v2-linux-${{ matrix.python_tag }}-torch${{ matrix.torch }}-

      - name: Verify locked clean RayD source
        shell: bash
        run: |
          git -C rayd remote set-url origin "$RAYD_REPOSITORY_URL"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          lock = json.loads(
              Path("channel/dependencies/rayd.lock.json").read_text(encoding="utf-8")
          )
          actual_commit = subprocess.check_output(
              ["git", "-C", "rayd", "rev-parse", "HEAD"], text=True
          ).strip()
          actual_remote = subprocess.check_output(
              ["git", "-C", "rayd", "remote", "get-url", "origin"], text=True
          ).strip()
          dirty = subprocess.check_output(
              ["git", "-C", "rayd", "status", "--porcelain", "--untracked-files=normal"],
              text=True,
          ).strip()
          assert lock["commit"] == os.environ["RAYD_COMMIT"], lock["commit"]
          assert actual_commit == os.environ["RAYD_COMMIT"], actual_commit
          assert lock["repository_url"] == os.environ["RAYD_REPOSITORY_URL"]
          assert actual_remote == os.environ["RAYD_REPOSITORY_URL"], actual_remote
          assert not dirty, dirty
          assert Path("rayd/drjit/scripts/verify_cuda_binary_arches.py").is_file()
          PY

      - name: Select the PyTorch release
        if: matrix.channel != 'pypi'
        shell: bash
        run: python channel/ci/wheel_matrix.py select-torch --pyproject channel/pyproject.toml --torch "${{ matrix.torch }}" --local "${{ matrix.local }}"

      - name: Expose sccache to manylinux
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/sccache-bin"
          cp "$(command -v sccache)" "$GITHUB_WORKSPACE/.cache/sccache-bin/sccache"

      - name: Free Linux disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true

      - name: Build and repair manylinux_2_28 wheel
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: ${{ matrix.python_tag }}-manylinux_x86_64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CACHE_PATH: ${{ github.workspace }}/.cache/cibuildwheel
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y dnf-plugins-core gcc-toolset-12 &&
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean expire-cache &&
            dnf install -y
            cuda-compiler-12-8
            cuda-cudart-devel-12-8
            cuda-cuobjdump-12-8
            cuda-driver-devel-12-8
            cuda-nvrtc-devel-12-8
            libcublas-devel-12-8
            libcusparse-devel-12-8
            libcusolver-devel-12-8 &&
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda &&
            /usr/local/cuda/bin/nvcc --version
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            CUDA_PATH=/usr/local/cuda
            CUDA_ROOT=/usr/local/cuda
            CUDA_BIN_PATH=/usr/local/cuda
            CUDACXX=/usr/local/cuda/bin/nvcc
            CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            RAYD_SOURCE_DIR=/host${{ github.workspace }}/rayd
            OPTIX_INCLUDE_DIR=/host${{ github.workspace }}/optix/include
            CMAKE_ARGS="-DRAYD_SOURCE_DIR=/host${{ github.workspace }}/rayd -DOPTIX_INCLUDE_DIR=/host${{ github.workspace }}/optix/include -DCMAKE_CUDA_ARCHITECTURES=${{ needs.metadata.outputs.cuda_architectures }} -DCHANNEL_RELEASE_BUILD=ON"
            CHANNEL_CUDA_GENCODE_FLAGS="${{ needs.metadata.outputs.gencode }}"
            RAYD_TORCH_CUDA_GENCODE_FLAGS="${{ needs.metadata.outputs.gencode }}"
            CMAKE_BUILD_PARALLEL_LEVEL=2
            CMAKE_C_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            CMAKE_CXX_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            SCCACHE_DIR=/host${{ github.workspace }}/.cache/channel-sccache
            SCCACHE_CACHE_SIZE=1G
            SCCACHE_BASEDIRS=/project
            SCCACHE_IGNORE_SERVER_IO_ERROR=1
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
          CIBW_BEFORE_BUILD_LINUX: >-
            git config --global --add safe.directory /project/channel &&
            git config --global --add safe.directory /host${{ github.workspace }}/rayd &&
            pip install --upgrade pip build twine &&
            pip install "cmake>=4.3,<4.4" "ninja>=1.13,<1.14" "scikit-build-core>=0.12,<0.13" &&
            pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cu128
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_28_x86_64
            --exclude libcuda.so.1
            --exclude libnvoptix.so.1
            --exclude libcudart.so.12
            --exclude libnvrtc.so.12
            --exclude libnvJitLink.so.12
            --exclude libcublas.so.12
            --exclude libcublasLt.so.12
            --exclude libcusparse.so.12
            --exclude libcusolver.so.11
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libtorch_global_deps.so
            -w {dest_dir} {wheel} &&
            python /host${{ github.workspace }}/rayd/drjit/scripts/verify_cuda_binary_arches.py
            --stem _channel
            --expected-sass ${{ needs.metadata.outputs.expected_sass }}
            --expected-ptx ${{ needs.metadata.outputs.expected_ptx }}
            {dest_dir}/*.whl &&
            /host${{ github.workspace }}/.cache/sccache-bin/sccache --show-stats &&
            chown -R --reference=/host${{ github.workspace }}
            /host${{ github.workspace }}/.cache/channel-sccache
        with:
          package-dir: channel
          output-dir: channel/dist

      - name: Verify Linux wheel metadata
        shell: bash
        run: |
          python channel/ci/wheel_matrix.py check-size channel/dist/*.whl --max-mib ${{ needs.metadata.outputs.max_wheel_mib }}
          python -m pip install build twine
          # Torch no longer depends on numpy, and Core is installed --no-deps
          # below, so numpy must arrive explicitly for the smoke.
          python -m pip install numpy
          python -m pip install torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cu128
          python -m pip install --no-deps ./core
          python -m build core --wheel --outdir core/dist
          python -m twine check channel/dist/*.whl
          python - <<'PY'
          import subprocess
          import sys
          import tempfile
          import zipfile
          from pathlib import Path

          # The consumer contract version has one home, the checked-in module;
          # read it through the wheel smoke helper instead of restating it.
          sys.path.insert(0, str(Path("channel/ci").resolve()))
          import wheel_smoke

          expected_contract_version = wheel_smoke.repository_consumer_contract_version()

          wheels = list(Path("channel/dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          core_wheels = list(Path("core/dist").glob("*.whl"))
          assert len(core_wheels) == 1, core_wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          extensions = [
              name
              for name in names
              if "/_channel" in name and name.endswith(".so")
          ]
          assert len(extensions) == 1, extensions
          assert not any(name.startswith("rayd/") for name in names)
          assert "manylinux_2_28_x86_64" in wheels[0].name, wheels[0]
          with tempfile.TemporaryDirectory(prefix="channel-linux-wheel-smoke-") as raw:
              target = Path(raw) / "site-packages"
              subprocess.run(
                  [
                      sys.executable,
                      "-m",
                      "pip",
                      "install",
                      "--disable-pip-version-check",
                      "--no-deps",
                      "--target",
                      str(target),
                      str(core_wheels[0]),
                      str(wheels[0]),
                  ],
                  check=True,
              )
              code = f"""
          import importlib.util
          from pathlib import Path
          import sys
          target = Path({str(target)!r}).resolve()
          sys.path.insert(0, str(target))
          sys.meta_path[:] = [
              finder for finder in sys.meta_path
              if finder.__class__.__module__ != "_witwin_channel_editable"
          ]
          import witwin.channel as channel
          import witwin.channel._channel as native
          import witwin.core as core
          from witwin.channel.propagation import consumer
          assert Path(channel.__file__).resolve().is_relative_to(target)
          assert Path(native.__file__).resolve().is_relative_to(target)
          assert Path(core.__file__).resolve().is_relative_to(target)
          assert channel.build_info()["backend"] == "channel"
          assert consumer.CONTRACT_VERSION == {expected_contract_version}, (
              consumer.CONTRACT_VERSION,
              {expected_contract_version},
          )
          required = {{
              "enumerated_canonical_compact",
              "enumerated_exact_pair_metadata",
              "evaluated_paths_compact_finalize",
              "evaluated_paths_compact_finalize_backward",
              "evaluated_paths_compact_finalize_jvp",
              "consumer_los_jones",
              "consumer_fixed_los_gather",
              "consumer_fixed_los_gather_backward",
              "consumer_fixed_los_gather_jvp",
              "runtime_probe",
          }}
          missing = sorted(name for name in required if not hasattr(native, name))
          assert not missing, missing
          """
              subprocess.run([sys.executable, "-I", "-c", code], check=True)
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: channel-wheel-${{ matrix.channel }}-linux-${{ matrix.python_tag }}-torch${{ matrix.torch }}
          path: channel/dist/*.whl
          if-no-files-found: error

  validate-wheels:
    name: Validate complete wheel set
    if: github.event_name == 'release' || inputs.scope == 'full'
    needs: [metadata, build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Download PyPI wheels
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-pypi-*
          path: dist/pypi
          merge-multiple: true

      - name: Download release-asset wheels
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-release-asset-*
          path: dist/release-asset
          merge-multiple: true

      - name: Validate wheel names, count and size
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          python channel/ci/wheel_matrix.py check-wheels dist/pypi --channel pypi --version "$VERSION"
          python channel/ci/wheel_matrix.py check-wheels dist/release-asset --channel release-asset --version "$VERSION"
          python - <<'PY'
          import zipfile
          from pathlib import Path

          for wheel in sorted(Path("dist").glob("*/*.whl")):
              members = zipfile.ZipFile(wheel).namelist()
              extensions = [
                  name
                  for name in members
                  if "/_channel" in name and name.endswith((".pyd", ".so"))
              ]
              assert len(extensions) == 1, (wheel, extensions)
              assert not any(name.startswith("rayd/") for name in members), wheel
          PY

  publish:
    name: Publish witwin-channel to PyPI
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.validate-wheels.result == 'success'
    needs: validate-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/witwin-channel/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download PyPI wheels
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-pypi-*
          path: dist
          merge-multiple: true

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  release-assets:
    name: Attach the other PyTorch builds to the GitHub release
    if: >-
      github.event_name == 'release' && github.event.action == 'published' &&
      needs.validate-wheels.result == 'success'
    needs: validate-wheels
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release-asset wheels
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-release-asset-*
          path: dist
          merge-multiple: true

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl --repo "$GITHUB_REPOSITORY"
