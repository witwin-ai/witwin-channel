name: Build and publish witwin-channel

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate_release:
    if: github.event_name != 'release' || (startsWith(github.event.release.tag_name, 'witwin-channel-v') && !github.event.release.prerelease)
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.package_dir.outputs.path }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve package directory
        id: package_dir
        shell: bash
        run: |
          if [ -f pyproject.toml ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f channel/pyproject.toml ]; then
            echo "path=channel" >> "$GITHUB_OUTPUT"
          else
            echo "Unable to find pyproject.toml for the witwin-channel package." >&2
            exit 1
          fi

      - name: Validate release tag and package version
        if: github.event_name == 'release'
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.package_dir.outputs.path }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import sys
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"witwin-channel-v(?P<version>[0-9A-Za-z.+_-]+)", tag)
          if match is None:
              print(f"Release tag '{tag}' must match 'witwin-channel-v<version>'.", file=sys.stderr)
              raise SystemExit(1)

          expected_version = match.group("version")
          pyproject_path = Path(os.environ["PACKAGE_DIR"]) / "pyproject.toml"
          data = tomllib.loads(pyproject_path.read_text(encoding="utf-8"))

          project = data["project"]
          package_name = project["name"]
          package_version = project["version"]

          if package_name != "witwin-channel":
              print(f"Expected package name 'witwin-channel', found '{package_name}'.", file=sys.stderr)
              raise SystemExit(1)

          if package_version != expected_version:
              print(
                  f"Release tag version '{expected_version}' does not match pyproject version '{package_version}'.",
                  file=sys.stderr,
              )
              raise SystemExit(1)

          print(f"Validated {package_name} {package_version} from {pyproject_path}.")
          PY

  build_cuda_wheels:
    name: Build CUDA wheel / ${{ matrix.os }} / py${{ matrix.python_version }}
    needs: validate_release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
        python_version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install CUDA Toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          log-file-suffix: "${{ runner.os }}-py${{ matrix.python_version }}"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Export Windows CUDA_HOME
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) {
            $nvcc = (Get-Command nvcc -ErrorAction Stop).Source
            $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          }
          "CUDA_HOME=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_ROOT=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_BIN_PATH=$cudaRoot" >> $env:GITHUB_ENV

      - name: Show toolchain
        shell: bash
        run: |
          python --version
          nvcc --version
          command -v cl || true

      - name: Install build frontend
        run: |
          python -m pip install --upgrade pip build drjit==1.3.1

      - name: Build platform wheel
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.validate_release.outputs.package_dir }}
          # scikit-build-core invokes CMake in build isolation; nanobind and
          # drjit==1.3.1 come from build-system.requires, CUDA from the toolkit
          # installed above. Pin the SASS/PTX targets so the wheel is GPU-less
          # build safe and broadly loadable.
          CMAKE_CUDA_ARCHITECTURES: "70-real;75-real;80-real;86-real;89-real;90-real;100-real;101-real;120-real;120-virtual"
        run: |
          python -m build --wheel "$PACKAGE_DIR"

      - name: Verify compiled CUDA architectures
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.validate_release.outputs.package_dir }}
        run: |
          python "$PACKAGE_DIR"/scripts/verify_cuda_binary_arches.py \
            --stem _channel_utils_native \
            --stem _deterministic_radiomap_native \
            --stem _monte_carlo_radiomap_native \
            "$PACKAGE_DIR"/dist/*.whl

      - name: Repair Linux wheel platform tag
        if: runner.os == 'Linux'
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.validate_release.outputs.package_dir }}
        run: |
          python -m pip install auditwheel patchelf
          drjit_dir="$(python -c 'import pathlib, drjit; print(pathlib.Path(drjit.__file__).parent)')"
          export LD_LIBRARY_PATH="$drjit_dir:${LD_LIBRARY_PATH:-}"
          mkdir -p "$PACKAGE_DIR"/wheelhouse
          for whl in "$PACKAGE_DIR"/dist/*-linux_x86_64.whl; do
            python -m auditwheel repair "$whl" \
              --plat manylinux_2_35_x86_64 \
              --wheel-dir "$PACKAGE_DIR"/wheelhouse \
              --exclude libdrjit-core.so --exclude libdrjit-extra.so \
              --exclude libnanothread.so \
              --exclude libcudart.so.12 --exclude libcuda.so.1
          done
          rm -f "$PACKAGE_DIR"/dist/*-linux_x86_64.whl
          mv "$PACKAGE_DIR"/wheelhouse/*.whl "$PACKAGE_DIR"/dist/
          ls -l "$PACKAGE_DIR"/dist

      - name: Smoke install native wheel layout
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.validate_release.outputs.package_dir }}
        run: |
          python -m pip uninstall -y witwin-channel || true
          python -m pip install --no-deps "$PACKAGE_DIR"/dist/*.whl
          python - <<'PY'
          import os
          import site
          import zipfile
          from pathlib import Path

          dist = Path(os.environ["PACKAGE_DIR"]) / "dist"
          wheels = sorted(dist.glob("*.whl"))
          assert wheels, f"no wheel produced in {dist}"
          wheel = wheels[-1]

          expected = (
              "_channel_utils_native",
              "_deterministic_radiomap_native",
              "_monte_carlo_radiomap_native",
          )
          names = zipfile.ZipFile(wheel).namelist()
          for stem in expected:
              if not any(stem in name for name in names):
                  raise SystemExit(f"native extension '{stem}' missing from {wheel.name}")

          roots = [Path(root) for root in site.getsitepackages()]
          for stem in expected:
              matches = [path for root in roots for path in root.glob(f"witwin/channel/_native/{stem}*")]
              binary = next((path for path in matches if path.suffix in {".pyd", ".so"}), None)
              assert binary is not None, f"installed native extension '{stem}' was not found"
              print(f"Installed native extension {stem} at {binary}")
          PY

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-py${{ matrix.python_version }}
          path: ${{ needs.validate_release.outputs.package_dir }}/dist/*.whl
          if-no-files-found: error

  build_sdist:
    name: Build source distribution
    needs: validate_release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build distributions
        shell: bash
        env:
          PACKAGE_DIR: ${{ needs.validate_release.outputs.package_dir }}
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist "$PACKAGE_DIR"

      - name: Upload source distribution artifact
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ${{ needs.validate_release.outputs.package_dir }}/dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs:
      - build_cuda_wheels
      - build_sdist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/witwin-channel/

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: dist
          merge-multiple: true

      - name: Select publishable distributions
        shell: bash
        # The CUDA toolkit action also uploads helper artifacts (for example,
        # cuda-installer.log), so prune dist/ to real distributions.
        run: |
          shopt -s nullglob dotglob
          for f in dist/*; do
            case "$f" in
              *.whl|*.tar.gz)
                : ;;
              *)
                echo "Dropping non-distribution file: $(basename "$f")"; rm -f "$f" ;;
            esac
          done
          echo "Publishing:"
          ls -1 dist
          if ! ls dist/*.whl dist/*.tar.gz >/dev/null 2>&1; then
            echo "No distributions left to publish." >&2
            exit 1
          fi

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
