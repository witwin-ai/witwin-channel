name: Build and publish witwin-channel

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope
        required: true
        default: windows-smoke
        type: choice
        options:
          - windows-smoke
          - full
          - windows-release-recovery
          - publish-recovery-artifacts
      source_sha:
        description: Release source commit for Windows recovery
        required: false
        type: string
      release_tag:
        description: Existing release tag for Windows recovery
        required: false
        type: string
      linux_artifact_run_id:
        description: Prior run containing channel-wheel-linux
        required: false
        type: string
      windows_artifact_run_id:
        description: Prior run containing channel-wheel-windows
        required: false
        type: string

concurrency:
  group: channel-distributions-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && github.sha || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  actions: read
  contents: read

env:
  RAYD_COMMIT: 49c58c4cb8212f6babb920cc88fb937509826cc5
  RAYD_REPOSITORY_URL: https://github.com/Asixa/RayD.git
  FULL_CUDA_ARCHITECTURES: 70-real;75-real;80-real;86-real;87-real;89-real;90-real;100-real;101-real;120-real;120-virtual
  FULL_EXPECTED_SASS: 70,75,80,86,87,89,90,100,101,120
  FULL_EXPECTED_PTX: "120"

jobs:
  metadata:
    name: Validate release metadata and CI policy
    runs-on: ubuntu-22.04
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate package, lock, and workflow policy
        working-directory: channel
        shell: bash
        run: |
          python -m pip install "pytest==8.4.2"
          python -m pytest -q --confcutdir=tests \
            tests/test_supported_runtime_matrix.py \
            tests/test_ci_tiers.py \
            tests/kernels/test_rayd_lock_cmake.py::test_rayd_lock_is_machine_readable_and_complete

      - name: Validate release tag and version
        if: github.event_name == 'release'
        working-directory: channel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"witwin-channel-v(?P<version>[0-9A-Za-z.+_-]+)", tag)
          if match is None:
              raise SystemExit(
                  f"release tag {tag!r} must match 'witwin-channel-v<version>'"
              )
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]
          if project["name"] != "witwin-channel":
              raise SystemExit(f"unexpected package name: {project['name']!r}")
          if project["version"] != match.group("version"):
              raise SystemExit(
                  f"tag version {match.group('version')!r} does not match "
                  f"project version {project['version']!r}"
              )
          PY

      - name: Validate Windows release recovery request
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.scope == 'windows-release-recovery' ||
          inputs.scope == 'publish-recovery-artifacts')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          LINUX_ARTIFACT_RUN_ID: ${{ inputs.linux_artifact_run_id }}
          WINDOWS_ARTIFACT_RUN_ID: ${{ inputs.windows_artifact_run_id }}
          RECOVERY_SCOPE: ${{ inputs.scope }}
        run: |
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" == "witwin-channel-v0.4.0" ]]
          [[ "$LINUX_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
          tag_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" \
              --jq '.object.sha'
          )"
          run_sha="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LINUX_ARTIFACT_RUN_ID}" \
              --jq '.head_sha'
          )"
          [[ "$tag_sha" == "$SOURCE_SHA" ]]
          [[ "$run_sha" == "$SOURCE_SHA" ]]
          artifact_count="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${LINUX_ARTIFACT_RUN_ID}/artifacts" \
              --jq '[.artifacts[] | select(.name == "channel-wheel-linux" and (.expired | not))] | length'
          )"
          [[ "$artifact_count" == "1" ]]
          if [[ "$RECOVERY_SCOPE" == "publish-recovery-artifacts" ]]; then
            [[ "$WINDOWS_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]]
            windows_run_conclusion="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WINDOWS_ARTIFACT_RUN_ID}" \
                --jq '.conclusion'
            )"
            [[ "$windows_run_conclusion" == "success" ]]
            windows_artifact_count="$(
              gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${WINDOWS_ARTIFACT_RUN_ID}/artifacts" \
                --jq '[.artifacts[] | select(.name == "channel-wheel-windows" and (.expired | not))] | length'
            )"
            [[ "$windows_artifact_count" == "1" ]]
          fi

  build-windows:
    name: Wheel / Windows / Python 3.11 / Torch 2.10
    if: github.event_name == 'release' || inputs.scope != 'publish-recovery-artifacts'
    needs: metadata
    runs-on: channel-windows-8core
    timeout-minutes: 150
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: "6"
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_CUDA_COMPILER_LAUNCHER: ""
      CMAKE_GENERATOR: Ninja
      SCCACHE_DIR: ${{ github.workspace }}\.cache\channel-sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_BASEDIRS: ${{ github.workspace }}
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-release-recovery' && inputs.source_sha || github.sha }}

      - name: Check out locked RayD 0.7.0 source
        uses: actions/checkout@v5
        with:
          repository: Asixa/RayD
          ref: ${{ env.RAYD_COMMIT }}
          path: rayd
          persist-credentials: false

      - name: Check out OptiX 8.1 headers
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: optix
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: channel/constraints/ci-py311-cu128.txt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"

      - name: Restore compiler cache
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}\.cache\channel-sccache
          key: channel-sccache-v1-windows-py311-cu128-${{ inputs.scope || 'release' }}-${{ github.sha }}
          restore-keys: |
            channel-sccache-v1-windows-py311-cu128-${{ inputs.scope || 'release' }}-
            channel-sccache-v1-windows-py311-cu128-

      - name: Install minimal CUDA 12.8 toolkit
        uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: "12.8.1"
          method: local
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration", "cublas", "cublas_dev", "cusparse", "cusparse_dev", "cusolver", "cusolver_dev"]'
          log-file-suffix: "channel-windows-py311"

      - name: Set up MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify locked clean RayD source
        shell: pwsh
        run: |
          git -C rayd remote set-url origin $env:RAYD_REPOSITORY_URL
          $lock = Get-Content -LiteralPath channel/dependencies/rayd.lock.json -Raw | ConvertFrom-Json
          $actualCommit = (git -C rayd rev-parse HEAD).Trim()
          $actualRemote = (git -C rayd remote get-url origin).Trim()
          $dirty = git -C rayd status --porcelain --untracked-files=normal
          if ($lock.commit -cne $env:RAYD_COMMIT) { throw "Channel lock commit mismatch: $($lock.commit)" }
          if ($actualCommit -cne $env:RAYD_COMMIT) { throw "RayD checkout commit mismatch: $actualCommit" }
          if ($lock.repository_url -cne $env:RAYD_REPOSITORY_URL) { throw "Channel lock repository mismatch: $($lock.repository_url)" }
          if ($actualRemote -cne $env:RAYD_REPOSITORY_URL) { throw "RayD checkout repository mismatch: $actualRemote" }
          if ($dirty) { throw "RayD checkout is dirty: $dirty" }

      - name: Configure CUDA build profile
        shell: pwsh
        run: |
          $arches = $env:FULL_CUDA_ARCHITECTURES
          $expectedSass = $env:FULL_EXPECTED_SASS
          $gencode = @(
            '--generate-code=arch=compute_70,code=[sm_70,sm_75]'
            '--generate-code=arch=compute_80,code=[sm_80,sm_86,sm_87,sm_89]'
            '--generate-code=arch=compute_90,code=sm_90'
            '--generate-code=arch=compute_100,code=[sm_100,sm_101]'
            '--generate-code=arch=compute_120,code=[sm_120,compute_120]'
          ) -join ' '
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ inputs.scope }}' -eq 'windows-smoke') {
            $arches = '87-real;120-real;120-virtual'
            $expectedSass = '87,120'
            $gencode = @(
              '--generate-code=arch=compute_87,code=sm_87'
              '--generate-code=arch=compute_120,code=[sm_120,compute_120]'
            ) -join ' '
          }
          $cudaRoot = $env:CUDA_PATH
          if (-not $cudaRoot) {
            $nvcc = (Get-Command nvcc -ErrorAction Stop).Source
            $cudaRoot = Split-Path (Split-Path $nvcc -Parent) -Parent
          }
          "CUDA_HOME=$cudaRoot" >> $env:GITHUB_ENV
          "CUDA_PATH=$cudaRoot" >> $env:GITHUB_ENV
          "CHANNEL_CUDA_GENCODE_FLAGS=$gencode" >> $env:GITHUB_ENV
          "RAYD_TORCH_CUDA_GENCODE_FLAGS=$gencode" >> $env:GITHUB_ENV
          "EXPECTED_SASS=$expectedSass" >> $env:GITHUB_ENV
          "EXPECTED_PTX=$env:FULL_EXPECTED_PTX" >> $env:GITHUB_ENV
          $rayd = (Resolve-Path -LiteralPath rayd).Path.Replace('\', '/')
          $optix = (Resolve-Path -LiteralPath optix/include).Path.Replace('\', '/')
          "CMAKE_ARGS=-DRAYD_SOURCE_DIR=$rayd -DOPTIX_INCLUDE_DIR=$optix -DCMAKE_CUDA_ARCHITECTURES=$arches -DCHANNEL_RELEASE_BUILD=ON" >> $env:GITHUB_ENV

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install `
            "cmake>=4.3,<4.4" `
            "ninja>=1.13,<1.14" `
            "scikit-build-core>=0.12,<0.13"
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128

      - name: Build Windows wheel
        shell: pwsh
        run: |
          $startedAt = Get-Date
          python -m build channel --wheel --no-isolation --outdir channel/dist `
            -Cbuild-dir="$env:RUNNER_TEMP/channel-skbuild"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $elapsedMinutes = ((Get-Date) - $startedAt).TotalMinutes
          "Windows Channel wheel build: {0:N2} minutes" -f $elapsedMinutes
          if ($elapsedMinutes -ge 100) {
            Write-Warning "Windows Channel wheel build exceeded the previous 100-minute target; continuing with artifact verification."
          }

      - name: Verify Windows wheel
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem channel/dist/*.whl -File -ErrorAction Stop).FullName
          python rayd/backends/drjit/scripts/verify_cuda_binary_arches.py `
            --stem _channel `
            --expected-sass $env:EXPECTED_SASS `
            --expected-ptx $env:EXPECTED_PTX `
            $wheel
          python -m twine check $wheel
          python -c "import sys,zipfile; n=zipfile.ZipFile(sys.argv[1]).namelist(); e=[x for x in n if '/_channel' in x and x.endswith('.pyd')]; assert len(e)==1,e; assert not any(x.startswith('rayd/') for x in n), 'RayD Python package leaked into Channel wheel'" $wheel
          sccache --show-stats

      - name: Upload Windows wheel
        uses: actions/upload-artifact@v4
        with:
          name: channel-wheel-windows
          path: channel/dist/*.whl
          if-no-files-found: error

  build-linux:
    name: Wheel / manylinux_2_28 / Python 3.11 / Torch 2.10
    if: github.event_name == 'release' || inputs.scope == 'full'
    needs: metadata
    runs-on: channel-linux-8core
    timeout-minutes: 150
    env:
      SCCACHE_DIR: ${{ github.workspace }}/.cache/channel-sccache
      SCCACHE_CACHE_SIZE: 1G
      SCCACHE_IGNORE_SERVER_IO_ERROR: "1"
    steps:
      - name: Check out Channel
        uses: actions/checkout@v5
        with:
          path: channel
          fetch-depth: 0

      - name: Check out locked RayD 0.7.0 source
        uses: actions/checkout@v5
        with:
          repository: Asixa/RayD
          ref: ${{ env.RAYD_COMMIT }}
          path: rayd
          persist-credentials: false

      - name: Check out OptiX 8.1 headers
        uses: actions/checkout@v5
        with:
          repository: NVIDIA/optix-dev
          ref: v8.1.0
          path: optix
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: channel/constraints/ci-py311-cu128.txt

      - name: Install sccache
        uses: mozilla-actions/sccache-action@v0.0.10
        with:
          version: "v0.11.0"

      - name: Restore compiler and cibuildwheel caches
        uses: actions/cache@v5
        with:
          path: |
            ${{ github.workspace }}/.cache/channel-sccache
            ${{ github.workspace }}/.cache/cibuildwheel
          key: channel-sccache-v1-linux-py311-cu128-full-${{ github.sha }}
          restore-keys: |
            channel-sccache-v1-linux-py311-cu128-full-

      - name: Verify locked clean RayD source
        shell: bash
        run: |
          git -C rayd remote set-url origin "$RAYD_REPOSITORY_URL"
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          lock = json.loads(
              Path("channel/dependencies/rayd.lock.json").read_text(encoding="utf-8")
          )
          actual_commit = subprocess.check_output(
              ["git", "-C", "rayd", "rev-parse", "HEAD"], text=True
          ).strip()
          actual_remote = subprocess.check_output(
              ["git", "-C", "rayd", "remote", "get-url", "origin"], text=True
          ).strip()
          dirty = subprocess.check_output(
              ["git", "-C", "rayd", "status", "--porcelain", "--untracked-files=normal"],
              text=True,
          ).strip()
          assert lock["commit"] == os.environ["RAYD_COMMIT"], lock["commit"]
          assert actual_commit == os.environ["RAYD_COMMIT"], actual_commit
          assert lock["repository_url"] == os.environ["RAYD_REPOSITORY_URL"]
          assert actual_remote == os.environ["RAYD_REPOSITORY_URL"], actual_remote
          assert not dirty, dirty
          PY

      - name: Expose sccache to manylinux
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/sccache-bin"
          cp "$(command -v sccache)" "$GITHUB_WORKSPACE/.cache/sccache-bin/sccache"

      - name: Free Linux disk space
        shell: bash
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
            /usr/local/share/powershell /usr/share/swift || true
          sudo docker image prune --all --force || true

      - name: Build and repair manylinux_2_28 wheel
        uses: pypa/cibuildwheel@v3.3.0
        env:
          CIBW_BUILD: cp311-manylinux_x86_64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CACHE_PATH: ${{ github.workspace }}/.cache/cibuildwheel
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"
          CIBW_BUILD_VERBOSITY: "1"
          CIBW_BEFORE_ALL_LINUX: >-
            dnf install -y dnf-plugins-core gcc-toolset-12 &&
            rpm --import https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/D42D0685.pub &&
            dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo &&
            dnf clean expire-cache &&
            dnf install -y
            cuda-compiler-12-8
            cuda-cudart-devel-12-8
            cuda-cuobjdump-12-8
            cuda-driver-devel-12-8
            cuda-nvrtc-devel-12-8
            libcublas-devel-12-8
            libcusparse-devel-12-8
            libcusolver-devel-12-8 &&
            ln -sfn /usr/local/cuda-12.8 /usr/local/cuda &&
            /usr/local/cuda/bin/nvcc --version
          CIBW_ENVIRONMENT_LINUX: >-
            CUDA_HOME=/usr/local/cuda
            CUDA_PATH=/usr/local/cuda
            CUDA_ROOT=/usr/local/cuda
            CUDA_BIN_PATH=/usr/local/cuda
            CUDACXX=/usr/local/cuda/bin/nvcc
            CUDAHOSTCXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
            PATH=/usr/local/cuda/bin:$PATH
            LD_LIBRARY_PATH=/usr/local/cuda/lib64:$LD_LIBRARY_PATH
            RAYD_SOURCE_DIR=/host${{ github.workspace }}/rayd
            OPTIX_INCLUDE_DIR=/host${{ github.workspace }}/optix/include
            CMAKE_ARGS="-DRAYD_SOURCE_DIR=/host${{ github.workspace }}/rayd -DOPTIX_INCLUDE_DIR=/host${{ github.workspace }}/optix/include -DCMAKE_CUDA_ARCHITECTURES=70-real;75-real;80-real;86-real;87-real;89-real;90-real;100-real;101-real;120-real;120-virtual -DCHANNEL_RELEASE_BUILD=ON"
            CHANNEL_CUDA_GENCODE_FLAGS="--generate-code=arch=compute_70,code=[sm_70,sm_75] --generate-code=arch=compute_80,code=[sm_80,sm_86,sm_87,sm_89] --generate-code=arch=compute_90,code=sm_90 --generate-code=arch=compute_100,code=[sm_100,sm_101] --generate-code=arch=compute_120,code=[sm_120,compute_120]"
            RAYD_TORCH_CUDA_GENCODE_FLAGS="--generate-code=arch=compute_70,code=[sm_70,sm_75] --generate-code=arch=compute_80,code=[sm_80,sm_86,sm_87,sm_89] --generate-code=arch=compute_90,code=sm_90 --generate-code=arch=compute_100,code=[sm_100,sm_101] --generate-code=arch=compute_120,code=[sm_120,compute_120]"
            CMAKE_BUILD_PARALLEL_LEVEL=6
            CMAKE_C_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            CMAKE_CXX_COMPILER_LAUNCHER=/host${{ github.workspace }}/.cache/sccache-bin/sccache
            SCCACHE_DIR=/host${{ github.workspace }}/.cache/channel-sccache
            SCCACHE_CACHE_SIZE=1G
            SCCACHE_BASEDIRS=/project
            SCCACHE_IGNORE_SERVER_IO_ERROR=1
            CC=/opt/rh/gcc-toolset-12/root/usr/bin/gcc
            CXX=/opt/rh/gcc-toolset-12/root/usr/bin/g++
          CIBW_BEFORE_BUILD_LINUX: >-
            git config --global --add safe.directory /project/channel &&
            git config --global --add safe.directory /host${{ github.workspace }}/rayd &&
            pip install --upgrade pip build twine &&
            pip install "cmake>=4.3,<4.4" "ninja>=1.13,<1.14" "scikit-build-core>=0.12,<0.13" &&
            pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cu128
          CIBW_REPAIR_WHEEL_COMMAND_LINUX: >-
            auditwheel repair --plat manylinux_2_28_x86_64
            --exclude libcuda.so.1
            --exclude libnvoptix.so.1
            --exclude libcudart.so.12
            --exclude libnvrtc.so.12
            --exclude libnvJitLink.so.12
            --exclude libcublas.so.12
            --exclude libcublasLt.so.12
            --exclude libcusparse.so.12
            --exclude libcusolver.so.11
            --exclude libc10.so
            --exclude libc10_cuda.so
            --exclude libtorch.so
            --exclude libtorch_cpu.so
            --exclude libtorch_cuda.so
            --exclude libtorch_python.so
            --exclude libtorch_global_deps.so
            -w {dest_dir} {wheel} &&
            python /host${{ github.workspace }}/rayd/backends/drjit/scripts/verify_cuda_binary_arches.py
            --stem _channel
            --expected-sass 70,75,80,86,87,89,90,100,101,120
            --expected-ptx 120
            {dest_dir}/*.whl &&
            /host${{ github.workspace }}/.cache/sccache-bin/sccache --show-stats &&
            chown -R --reference=/host${{ github.workspace }}
            /host${{ github.workspace }}/.cache/channel-sccache
        with:
          package-dir: channel
          output-dir: channel/dist

      - name: Verify Linux wheel metadata
        working-directory: channel
        shell: bash
        run: |
          python -m pip install twine
          python -m twine check dist/*.whl
          python - <<'PY'
          import zipfile
          from pathlib import Path

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          names = zipfile.ZipFile(wheels[0]).namelist()
          extensions = [
              name
              for name in names
              if "/_channel" in name and name.endswith(".so")
          ]
          assert len(extensions) == 1, extensions
          assert not any(name.startswith("rayd/") for name in names)
          assert "manylinux_2_28_x86_64" in wheels[0].name, wheels[0]
          PY

      - name: Upload Linux wheel
        uses: actions/upload-artifact@v4
        with:
          name: channel-wheel-linux
          path: channel/dist/*.whl
          if-no-files-found: error

  validate-wheels:
    name: Validate complete wheel set
    if: >-
      always() &&
      ((inputs.scope == 'publish-recovery-artifacts' &&
      needs.build-windows.result == 'skipped' &&
      needs.build-linux.result == 'skipped') ||
      (needs.build-windows.result == 'success' &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')))
    needs: [build-windows, build-linux]
    runs-on: ubuntu-22.04
    steps:
      - name: Download wheel artifacts
        if: inputs.scope != 'publish-recovery-artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-*
          path: dist
          merge-multiple: true

      - name: Download recovered Linux wheel
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.scope == 'windows-release-recovery' ||
          inputs.scope == 'publish-recovery-artifacts')
        uses: actions/download-artifact@v4
        with:
          name: channel-wheel-linux
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_artifact_run_id }}

      - name: Download recovered Windows wheel
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'publish-recovery-artifacts'
        uses: actions/download-artifact@v4
        with:
          name: channel-wheel-windows
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_artifact_run_id }}

      - name: Validate artifact count and tags
        shell: bash
        env:
          EXPECTED_COUNT: ${{ (needs.build-linux.result == 'success' || inputs.scope == 'windows-release-recovery' || inputs.scope == 'publish-recovery-artifacts') && '2' || '1' }}
        run: |
          python - <<'PY'
          import os
          import re
          import zipfile
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == int(os.environ["EXPECTED_COUNT"]), wheels
          names = [wheel.name for wheel in wheels]
          assert any(name.endswith("-cp311-cp311-win_amd64.whl") for name in names)
          if len(wheels) == 2:
              assert any("manylinux_2_28_x86_64.whl" in name for name in names)
          for wheel in wheels:
              assert re.match(r"witwin_channel-0\.4\.0-", wheel.name), wheel
              members = zipfile.ZipFile(wheel).namelist()
              extensions = [
                  name
                  for name in members
                  if "/_channel" in name and name.endswith((".pyd", ".so"))
              ]
              assert len(extensions) == 1, (wheel, extensions)
              assert not any(name.startswith("rayd/") for name in members), wheel
          PY

  publish:
    name: Publish witwin-channel to PyPI
    if: >-
      always() &&
      needs.validate-wheels.result == 'success' &&
      ((github.event_name == 'release' && github.event.action == 'published') ||
      (github.event_name == 'workflow_dispatch' &&
      (inputs.scope == 'windows-release-recovery' ||
      inputs.scope == 'publish-recovery-artifacts')))
    needs: validate-wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/witwin-channel/
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Download wheel artifacts
        if: inputs.scope != 'publish-recovery-artifacts'
        uses: actions/download-artifact@v4
        with:
          pattern: channel-wheel-*
          path: dist
          merge-multiple: true

      - name: Download recovered Linux wheel
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.scope == 'windows-release-recovery' ||
          inputs.scope == 'publish-recovery-artifacts')
        uses: actions/download-artifact@v4
        with:
          name: channel-wheel-linux
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.linux_artifact_run_id }}

      - name: Download recovered Windows wheel
        if: github.event_name == 'workflow_dispatch' && inputs.scope == 'publish-recovery-artifacts'
        uses: actions/download-artifact@v4
        with:
          name: channel-wheel-windows
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.windows_artifact_run_id }}

      - name: Publish wheels
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
