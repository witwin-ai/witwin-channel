name: Scheduled and Release

on:
  schedule:
    - cron: '0 7 * * 0'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  WITWIN_CI_ENVIRONMENT: witwin2
  WITWIN_CI_PYTHON: '${{ vars.WITWIN2_PYTHON }}'
  WITWIN_CHECKOUT_DIR: 'fresh/channel-native-${{ github.run_id }}-${{ github.run_attempt }}-release'
  WITWIN_RAYD_DIR: 'fresh/rayd-${{ github.run_id }}-${{ github.run_attempt }}-release'
  WITWIN_CHANNEL_NATIVE_SCENE_ROOT: '${{ vars.WITWIN_CHANNEL_NATIVE_SCENE_ROOT }}'

jobs:
  release:
    name: Release / Python 3.11 / Windows X64 CUDA SM120
    runs-on: [self-hosted, Windows, X64, CUDA]
    timeout-minutes: 720
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          path: '${{ env.WITWIN_CHECKOUT_DIR }}'
      - name: Checkout locked RayD
        uses: actions/checkout@v4
        with:
          repository: Asixa/RayD
          ref: 5df6497d36ac941bbc88b26dc3c16e373ee37705
          path: '${{ env.WITWIN_RAYD_DIR }}'
      - name: Verify immutable RayD checkout
        shell: pwsh
        working-directory: '${{ env.WITWIN_CHECKOUT_DIR }}'
        run: |
          $expected = '5df6497d36ac941bbc88b26dc3c16e373ee37705'
          $lock = Get-Content -LiteralPath 'dependencies/rayd.lock.json' -Raw | ConvertFrom-Json
          if ($lock.commit -cne $expected) { throw "RayD workflow ref does not match dependencies/rayd.lock.json: $($lock.commit)" }
          $rayd = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $env:WITWIN_RAYD_DIR)).Path
          $actual = (& git -C $rayd rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($actual -cne $expected) { throw "RayD checkout is not the immutable workflow ref: $actual" }
      - name: Configure MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Verify the supported witwin2 runtime
        shell: pwsh
        working-directory: '${{ env.WITWIN_CHECKOUT_DIR }}'
        run: |
          $python = $env:WITWIN_CI_PYTHON
          if ([string]::IsNullOrWhiteSpace($python)) { throw 'Repository variable WITWIN2_PYTHON is required' }
          if ([string]::IsNullOrWhiteSpace($env:WITWIN_CHANNEL_NATIVE_SCENE_ROOT)) { throw 'Repository variable WITWIN_CHANNEL_NATIVE_SCENE_ROOT is required for full Munich/SF release acceptance' }
          if (-not (Test-Path -LiteralPath $env:WITWIN_CHANNEL_NATIVE_SCENE_ROOT -PathType Container)) { throw "WITWIN_CHANNEL_NATIVE_SCENE_ROOT is not a directory: $env:WITWIN_CHANNEL_NATIVE_SCENE_ROOT" }
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw "WITWIN2_PYTHON does not exist: $python" }
          & $python -c "import pathlib, sys, torch; assert sys.version_info[:2] == (3, 11); assert pathlib.Path(sys.prefix).name == 'witwin2'; assert torch.__version__.split('+')[0] == '2.10.0'; assert torch.version.cuda == '12.8'; assert torch.cuda.is_available(); assert torch.cuda.get_device_capability() == (12, 0)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Fresh configure and build against locked RayD
        shell: pwsh
        working-directory: '${{ env.WITWIN_CHECKOUT_DIR }}'
        run: |
          $python = $env:WITWIN_CI_PYTHON
          $rayd = (Resolve-Path -LiteralPath (Join-Path $env:GITHUB_WORKSPACE $env:WITWIN_RAYD_DIR)).Path
          $buildDir = Join-Path $env:RUNNER_TEMP "channel-native-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT-$env:GITHUB_JOB"
          & $python -m cmake -S . -B $buildDir -G Ninja -DCMAKE_BUILD_TYPE=Release "-DPython_EXECUTABLE=$python" "-DRAYD_SOURCE_DIR=$rayd" -DCMAKE_CUDA_ARCHITECTURES=120 -DCHANNEL_NATIVE_RELEASE_BUILD=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $python -m cmake --build $buildDir --config Release --parallel
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $extensions = @(Get-ChildItem -LiteralPath $buildDir -Recurse -File | Where-Object { $_.Name -like '_channel_native*.pyd' })
          if ($extensions.Count -ne 1) { throw "Expected one built _channel_native extension, found $($extensions.Count)" }
          $fingerprintPath = Join-Path $buildDir '_channel_native.build-fingerprint'
          if (-not (Test-Path -LiteralPath $fingerprintPath -PathType Leaf)) { throw "Missing build fingerprint: $fingerprintPath" }
          $fingerprint = (Get-Content -LiteralPath $fingerprintPath -Raw).Trim()
          if ($fingerprint -notmatch '^[0-9a-f]{64}$') { throw 'Build fingerprint is not a SHA-256 digest' }
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value 'WITWIN_CHANNEL_NATIVE_DEVELOPER_OVERRIDE=1'
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "WITWIN_CHANNEL_NATIVE_EXTENSION_PATH=$($extensions[0].FullName)"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "WITWIN_CHANNEL_NATIVE_EXPECTED_FINGERPRINT=$fingerprint"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "RAYD_SOURCE_DIR=$rayd"
          Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Value "CMAKE_ARGS=-DRAYD_SOURCE_DIR=$rayd -DCMAKE_CUDA_ARCHITECTURES=120 -DCHANNEL_NATIVE_RELEASE_BUILD=ON"
      - name: Run scheduled or per-release tier
        shell: pwsh
        working-directory: '${{ env.WITWIN_CHECKOUT_DIR }}'
        run: '& $env:WITWIN_CI_PYTHON ci/run_ci_tier.py release'
      - name: Upload release wheel and PE evidence
        uses: actions/upload-artifact@v4
        with:
          name: 'release-wheel-pe-${{ github.run_id }}-${{ github.run_attempt }}'
          path: |
            ${{ env.WITWIN_CHECKOUT_DIR }}/artifacts/nightly/wheel-smoke-pe-audit.v1.json
            ${{ env.WITWIN_CHECKOUT_DIR }}/artifacts/release/wheel-smoke-pe-audit.v1.json
          if-no-files-found: error
