[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[project]
name = "raydtorch"
version = "0.0.0"
description = "Torch-native RayD geometry and multipath primitives."
requires-python = ">=3.10"
dependencies = ["torch"]

[tool.scikit-build]
wheel.packages = ["raydtorch"]
