[build-system]
requires = [
    "cmake>=4.3,<4.4",
    "ninja>=1.13,<1.14",
    "scikit-build-core>=0.12,<0.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "witwin-channel"
version = "0.5.0"
description = "GPU-accelerated differentiable wireless propagation simulation for RF digital twins."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.10.0", "witwin==0.4.0"]

[project.optional-dependencies]
# Developer tools and test-only libraries, pinned to constraints/ci-py311-cu128.txt.
dev = ["coverage==7.13.1", "mypy==1.18.2", "pytest==8.4.2", "ruff==0.15.10", "scipy==1.17.1"]

[tool.scikit-build]
wheel.packages = ["witwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
files = [
    "witwin/channel/capabilities.py",
    "witwin/channel/deployment.py",
    "witwin/channel/runtime.py",
    "witwin/channel/deterministic.py",
    "witwin/channel/montecarlo/basic.py",
    "witwin/channel/montecarlo/bdpt.py",
    "witwin/channel/path.py",
    "witwin/channel/presets.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["witwin/channel"]

[tool.coverage.report]
precision = 2
