[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.11",
    "drjit==1.3.1",
]
build-backend = "scikit_build_core.build"

[project]
name = "witwin-channel"
version = "0.1.0"
description = "Witwin Channel - Wireless channel simulation (RadioMap & Path/CIR)"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"

dependencies = [
    "witwin>=0.1,<0.2",
    "drjit==1.3.1",
    "numpy>=1.24",
    "torch>=2.10,<2.12",
]

[tool.scikit-build]
build.verbose = true
wheel.packages = ["witwin"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp -p no:cacheprovider"
markers = [
    "gpu: test requires a CUDA-capable environment",
    "acceptance: end-to-end acceptance or validation coverage",
    "validation: solver/reference validation coverage",
    "optimize: long-running optimization coverage, skipped unless --run-optimize is set",
]
