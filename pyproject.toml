[build-system]
requires = [
    "cmake>=4.3,<4.4",
    "ninja>=1.13,<1.14",
    "scikit-build-core>=0.12,<0.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "witwin-channel"
version = "0.6.0"
description = "GPU-accelerated differentiable wireless propagation simulation for RF digital twins."
readme = "README.md"
# One wheel per CPython minor; the release workflow builds cp310 to cp313.
requires-python = ">=3.10,<3.14"
# The extension links the non-stable LibTorch C++ ABI, so every wheel pins the exact PyTorch
# release it was compiled against (the loader rejects any other). See CONTRIBUTING.md.
dependencies = ["torch==2.10.0", "witwin>=0.4,<0.5"]
license = "LicenseRef-Witwin-Dual"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Xingyu Chen" }]
keywords = ["ray tracing", "wireless", "propagation", "radio", "digital twin", "differentiable", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://witwin.ai"
License = "https://witwin.ai/license"
Repository = "https://github.com/witwin-ai/witwin-channel"
Issues = "https://github.com/witwin-ai/witwin-channel/issues"

[project.scripts]
witwin-channel-doctor = "witwin.channel.deployment:main"

[project.optional-dependencies]
# Developer tools and test-only libraries, pinned to constraints/ci-py311-cu128.txt.
dev = ["coverage==7.13.1", "mypy==1.18.2", "pytest==8.4.2", "ruff==0.15.10", "scipy==1.17.1"]

[tool.scikit-build]
wheel.packages = ["witwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["witwin/channel"]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["witwin/channel"]

[tool.coverage.report]
precision = 2
