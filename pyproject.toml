[build-system]
requires = [
    "cmake>=4.3,<4.4",
    "ninja>=1.13,<1.14",
    "scikit-build-core>=0.12,<0.13",
]
build-backend = "scikit_build_core.build"

[project]
name = "witwin-channel-native"
version = "0.1.0"
description = "DrJit-free Torch/CUDA RF channel runtime."
requires-python = ">=3.11,<3.12"
dependencies = ["torch==2.10.0"]

[tool.scikit-build]
wheel.packages = ["src/witwin"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.11"
files = [
    "src/witwin/channel_native/capabilities.py",
    "src/witwin/channel_native/deployment.py",
    "src/witwin/channel_native/runtime/native_buffers.py",
    "src/witwin/channel_native/runtime/native_handles.py",
    "src/witwin/channel_native/runtime/tensor_contracts.py",
    "src/witwin/channel_native/runtime/torch_compat.py",
    "src/witwin/channel_native/deterministic/config.py",
    "src/witwin/channel_native/montecarlo/basic/config.py",
    "src/witwin/channel_native/montecarlo/bdpt/config.py",
    "src/witwin/channel_native/path/config.py",
]
follow_imports = "skip"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
warn_unused_configs = true

[tool.coverage.run]
branch = true
source = ["src/witwin/channel_native"]

[tool.coverage.report]
precision = 2
